/* =========================

   ========================= */

    600px;

    0

    25px;

}


.search-box input {

  width:

  border:
    none;


  border-radius:
    12px;


  font-size:
    16px;

   ========================= */

    0

.search-message {

  text-align:

  color:

  font-size:
    14px;


  margin:
    15px
    0;

}


/* =========================
   検索結果カード
   ========================= */

.search-result-item {

  display:

  text-decoration:

  color:

  background:

      0.82

  padding:
    18px;


  margin:
    12px
    0;


  text-align:
    left;


  transition:
    0.2s;

}


.search-result-item:active {

  transform:
    scale(

    );

}


.result-song {

  font-size:
    18px;


  font-weight:
    bold;


  margin-bottom:
    8px;

}


.result-album {

  font-size:
    14px;


  color:
    #dddddd;


  margin-bottom:
    5px;

}


.result-artist {

  font-size:
    13px;


  color:
    #aaaaaa;

/* =========================================================
   検索処理
   ========================================================= */

function searchMusic() {


  const input =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  const results =
    document.getElementById(
      "searchResults"
    );


  const message =
    document.getElementById(
      "searchMessage"
    );


  /*
   * 初期状態
   */

  if (
    input === ""
  ) {


    results.innerHTML =
      "";


    message.textContent =
      "アーティスト名、アルバム名、曲名を入力してください";


    return;

  }


  /*
   * 検索
   */

  const foundSongs =
    musicSearchData.filter(
      function (item) {


        const searchTargets = [

          item.artist,

          item.album,

          item.title,

          ...item.keywords

        ];


        return searchTargets.some(
          function (word) {


            return (
              word
                .toLowerCase()
                .includes(
                  input
                )
            );

          }
        );

      }
    );


  /*
   * 結果なし
   */

  if (
    foundSongs.length === 0
  ) {


    results.innerHTML =
      "";


    message.textContent =
      "見つかりませんでした";


    return;

  }


  /*
   * 検索結果表示
   */

  message.textContent =
    foundSongs.length +
    "件見つかりました";


  results.innerHTML =
    "";


  foundSongs.forEach(
    function (item) {


      results.innerHTML +=
        `

        <a
          href="${item.link}"
          class="search-result-item"
        >

          <div
            class="result-song"
          >

            🎵 ${item.title}

          </div>


          <div
            class="result-album"
          >

            💿 ${item.album}

          </div>


          <div
            class="result-artist"
          >

            ${item.artist}

          </div>

        </a>

        `;

    }
  );

}
