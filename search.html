<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>検索 - Okay Music</title>

<link rel="apple-touch-icon"
      href="00001.png">

<link rel="stylesheet"
      href="style.css">

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  crossorigin="anonymous"
  referrerpolicy="no-referrer"
/>

<style>

/* =========================
   検索ページ
   ========================= */

.search-page-title {
    text-align: center;
    margin: 25px 0 20px;
    font-size: 24px;
}


/* =========================
   検索ボックス
   ========================= */

.search-box {
    width: 90%;
    max-width: 600px;
    margin: 0 auto 25px;
}

.search-box input {
    width: 100%;
    box-sizing: border-box;

    padding: 14px 18px;

    border-radius: 25px;
    border: 1px solid #ccc;

    font-size: 16px;

    outline: none;

    background: rgba(255,255,255,0.95);
}

.search-box input:focus {
    border-color: #777;
}


/* =========================
   検索結果
   ========================= */

.search-results {
    width: 90%;
    max-width: 700px;

    margin: 0 auto 100px;
}


/* =========================
   メッセージ
   ========================= */

.search-message {
    text-align: center;

    margin: 30px 0;

    color: #777;

    font-size: 15px;
}


/* =========================
   検索結果カード
   ========================= */

.search-result-item {

    display: block;

    padding: 16px 18px;

    margin-bottom: 12px;

    border-radius: 12px;

    background: rgba(255,255,255,0.90);

    text-decoration: none;

    color: inherit;

    transition:
        transform 0.15s ease,
        background 0.15s ease;
}

.search-result-item:hover {

    background: rgba(255,255,255,1);

    transform: translateY(-1px);
}


/* =========================
   曲名
   ========================= */

.result-song {

    font-size: 17px;

    font-weight: bold;

    margin-bottom: 5px;
}


/* =========================
   アルバム
   ========================= */

.result-album {

    font-size: 14px;

    color: #555;

    margin-bottom: 3px;
}


/* =========================
   アーティスト
   ========================= */

.result-artist {

    font-size: 13px;

    color: #888;
}


/* =========================
   スマホ
   ========================= */

@media (max-width: 600px) {

    .search-page-title {
        font-size: 22px;
    }

    .search-box {
        width: 92%;
    }

    .search-results {
        width: 92%;
    }

    .search-result-item {
        padding: 14px 16px;
    }

    .result-song {
        font-size: 16px;
    }

}

</style>

</head>


<body>


<!-- =========================
     ページタイトル
     ========================= -->

<h1 class="search-page-title">

<i class="fa-solid fa-magnifying-glass"></i>

検索

</h1>


<!-- =========================
     検索ボックス
     ========================= -->

<div class="search-box">

<input
    type="search"
    id="searchInput"
    placeholder="アーティスト・アルバム・曲名を検索"
    autocomplete="off"
>

</div>


<!-- =========================
     検索結果
     ========================= -->

<div
    id="searchResults"
    class="search-results">
</div>


<!-- =========================
     メッセージ
     ========================= -->

<div
    id="searchMessage"
    class="search-message">

検索したいアーティスト・アルバム・曲名を入力してください。

</div>


<script>

/* =========================================================
   Okay Music 検索
   =========================================================

   検索データは search-index.json から自動取得します。

   ここにはアルバム名や曲名を手書きしません。

   新しいアルバムを追加しても、
   search.html は変更不要です。

   ========================================================= */


let musicSearchData = [];

let searchReady = false;


/* =========================================================
   検索インデックス読み込み
   ========================================================= */

async function loadSearchIndex() {

    const message =
        document.getElementById("searchMessage");

    try {

        const response =
            await fetch(
                "search-index.json?ver=" + Date.now()
            );

        if (!response.ok) {

            throw new Error(
                "search-index.json を読み込めませんでした"
            );

        }

        musicSearchData =
            await response.json();

        searchReady = true;

        console.log(
            "検索インデックス読み込み完了:",
            musicSearchData.length
        );

    } catch (error) {

        console.error(
            "検索インデックス読み込みエラー:",
            error
        );

        message.textContent =
            "検索データを読み込めませんでした。";

    }

}


/* =========================================================
   検索
   ========================================================= */

function searchMusic() {

    const input =
        document.getElementById("searchInput");

    const results =
        document.getElementById("searchResults");

    const message =
        document.getElementById("searchMessage");


    const keyword =
        input.value
            .trim()
            .toLowerCase();


    /* -------------------------
       入力なし
       ------------------------- */

    if (!keyword) {

        results.innerHTML = "";

        message.textContent =
            "検索したいアーティスト・アルバム・曲名を入力してください。";

        return;

    }


    /* -------------------------
       データ読み込み前
       ------------------------- */

    if (!searchReady) {

        results.innerHTML = "";

        message.textContent =
            "検索データを読み込んでいます…";

        return;

    }


    /* -------------------------
       検索
       ------------------------- */

    const matched =
        musicSearchData.filter(item => {

            const artist =
                String(item.artist || "")
                    .toLowerCase();

            const album =
                String(item.album || "")
                    .toLowerCase();

            const title =
                String(item.title || "")
                    .toLowerCase();

            const keywords =
                Array.isArray(item.keywords)
                    ? item.keywords
                        .join(" ")
                        .toLowerCase()
                    : String(item.keywords || "")
                        .toLowerCase();


            return (
                artist.includes(keyword) ||
                album.includes(keyword) ||
                title.includes(keyword) ||
                keywords.includes(keyword)
            );

        });


    /* -------------------------
       結果なし
       ------------------------- */

    if (matched.length === 0) {

        results.innerHTML = "";

        message.textContent =
            "「" + input.value + "」に一致する曲はありません。";

        return;

    }


    /* -------------------------
       結果あり
       ------------------------- */

    message.textContent =
        matched.length + "件見つかりました。";


    results.innerHTML =
        matched.map(item => {

            const artist =
                escapeHtml(item.artist || "");

            const album =
                escapeHtml(item.album || "");

            const title =
                escapeHtml(item.title || "");

            const url =
                item.url || "#";


            return `

<a
    href="${url}"
    class="search-result-item"
>

    <div class="result-song">

        ${title}

    </div>

    <div class="result-album">

        ${album}

    </div>

    <div class="result-artist">

        ${artist}

    </div>

</a>

`;

        }).join("");

}


/* =========================================================
   HTMLエスケープ
   ========================================================= */

function escapeHtml(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =========================================================
   入力イベント
   ========================================================= */

document
    .getElementById("searchInput")
    .addEventListener(
        "input",
        searchMusic
    );


/* =========================================================
   検索インデックス開始
   ========================================================= */

loadSearchIndex();


</script>


<!-- =========================
     共通 script
     ========================= -->

<script src="script.js"></script>


</body>

</html>
