<style>
body {

  background-image:
  linear-gradient(
    rgba(0,0,0,0.55),
    rgba(0,0,0,0.55)
  ),
  url("background.jpg");

  background-size: cover;
  background-position: center;
  background-attachment: fixed;

  color: white;
  font-family: sans-serif;
  text-align: center;

 padding: 12px 15px 150px 15px;
  min-height: 100vh;
  
  height: 100dvh;
  overflow: hidden;
  box-sizing: border-box;

}


h1 {
  font-size: 19px;
  text-align: left;
  margin: 0;
}

.message {
  font-size: 11px;
  text-align: left;
  margin: 3px 0 15px;
  line-height: 1.4;
}


.search-box {

  margin: 30px auto;

}


.search-box input {

  width: 80%;

  max-width: 350px;

  padding: 12px;

  border-radius: 10px;

  border: none;

  font-size: 16px;

}


.result {

  background: rgba(40,40,40,0.9);

  padding: 15px;

  margin: 10px auto;

  border-radius: 10px;

  max-width: 400px;

  display: none;

}


.result a {

  color: white;

  text-decoration: none;

}


/* =========================
   アーティスト・ディスクチェンジャー
   ========================= */

.artist-changer {

  position: relative;

  width: 100%;

  max-width: 450px;

  margin: 25px auto 10px;

  display: flex;

  align-items: center;

  justify-content: center;

}


.artist-slider {

  width: 94%;

  overflow: hidden;

  border-radius: 18px;

  background: #222;

  box-shadow: 0 8px 25px rgba(0,0,0,0.5);

}


.artist-slide {

  display: none;

  color: white;

  text-decoration: none;

}


.artist-slide.active {

  display: block;

  animation: slideIn 0.35s ease;

}


.artist-slide img {

  display: block;

  width: 100%;

  aspect-ratio: 1 / 1;

  object-fit: cover;

}


.artist-title {

  padding: 14px 10px;

  font-size: 20px;

  font-weight: bold;

}


.change-btn {

  position: absolute;

  width: 42px;

  height: 42px;

  border: none;

  border-radius: 50%;

  background: rgba(30,30,30,0.9);

  color: white;

  font-size: 35px;

  line-height: 35px;

  cursor: pointer;

  z-index: 5;

}


.change-btn.left {
  left: -2px;
}

.change-btn.right {
  right: -2px;
}


.change-btn:active {

  transform: scale(0.9);

}


.artist-dots {

  display: flex;

  justify-content: center;

  gap: 8px;

  margin: 12px 0 20px;

}


.artist-dots span {

  width: 7px;

  height: 7px;

  border-radius: 50%;

  background: #777;

}


.artist-dots span.active {

  background: white;

  transform: scale(1.3);

}


@keyframes slideIn {

  from {

    opacity: 0;

    transform: translateX(30px);

  }

  to {

    opacity: 1;

    transform: translateX(0);

  }

}




</style>

<span></span>

<script>


/* =========================
   アーティスト切り替え
   ========================= */

let currentArtist = 0;


const artistSlides =
document.querySelectorAll(".artist-slide");


const artistDots =
document.querySelectorAll(".artist-dots span");


function showArtist(index) {


if (index >= artistSlides.length) {

index = 0;

}


if (index < 0) {

index = artistSlides.length - 1;

}


artistSlides.forEach(function(slide) {

slide.classList.remove("active");

});


artistDots.forEach(function(dot) {

dot.classList.remove("active");

});


artistSlides[index].classList.add("active");

artistDots[index].classList.add("active");


currentArtist = index;

}


function nextArtist() {

showArtist(currentArtist + 1);

}


function prevArtist() {

showArtist(currentArtist - 1);

}


/* =========================
   スマホのスワイプ
   ========================= */

let touchStartX = 0;

let touchEndX = 0;


const slider =
document.getElementById("artistSlider");


slider.addEventListener(
"touchstart",
function(e) {

touchStartX =
e.changedTouches[0].screenX;

}
);


slider.addEventListener(
"touchend",
function(e) {

touchEndX =
e.changedTouches[0].screenX;

handleSwipe();

}
);


function handleSwipe() {


const distance =
touchEndX - touchStartX;


if (Math.abs(distance) < 50) {

return;

}


if (distance < 0) {

nextArtist();

} else {

prevArtist();

}

}


/* =========================

function searchMusic() {

  let input =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();

  let result =
    document.getElementById("result");

  result.innerHTML = "";

  if (input === "") {
    result.style.display = "none";
    return;
  }

  let found = false;

  musicData.forEach(function(item) {

    let hit =
      item.keyword.some(function(word) {

        return word
          .toLowerCase()
          .includes(input);

      });

    if (hit) {

      result.innerHTML += `
        <a href="${item.link}">
          💿 ${item.title}<br>
          ${item.artist}
        </a>
        <hr>
      `;

      found = true;

    }

  });

  if (found) {

    result.style.display = "block";

  } else {

    result.innerHTML = "見つかりませんでした";
    result.style.display = "block";

  }

}

</script>
