<style>

body {

  background-image:
  linear-gradient(
    rgba(0,0,0,0.55),
    rgba(0,0,0,0.55)
  ),
  url("background.jpg");

  background-size: cover;
  background-position: center;
  background-attachment: fixed;

  color: white;
  font-family: sans-serif;
  text-align: center;

  padding: 30px;
  min-height: 100vh;

}



h1 {
  font-size: 40px;
}



.message {

  font-size: 18px;

  margin-bottom: 30px;

}



.search-box {

  margin: 30px auto;

}



.search-box input {

  width: 80%;

  max-width: 350px;

  padding: 12px;

  border-radius: 10px;

  border: none;

  font-size: 16px;

}



.menu {

  background: rgba(20,20,20,0.85);

  padding: 25px;

  margin: 20px auto;

  border-radius: 15px;

  max-width: 400px;

}



.menu a {

  color: white;

  text-decoration: none;

  font-size: 22px;

}



.menu a:hover {

  opacity: 0.7;

}



.result {

  background: rgba(40,40,40,0.9);

  padding: 15px;

  margin: 10px auto;

  border-radius: 10px;

  max-width: 400px;

  display: none;

}



.result a {

  color:white;

  text-decoration:none;

}


/* 下部4ボタン */

.nav {

  position: fixed;

  bottom: 0;

  left: 0;

  width: 100%;

  display: flex;

  justify-content: space-around;

  background: rgba(20,20,20,.95);

  padding: 10px 0 calc(10px + env(safe-area-inset-bottom));

  border-top: 1px solid #555;

  z-index: 9999;

}


.nav-btn {

  color: #c0c0c0;

  text-decoration: none;

  display: flex;

  flex-direction: column;

  align-items: center;

  font-size: 12px;

  gap: 4px;

  width: 25%;

}


.nav-btn:hover {

  transform: scale(1.08);

}


.nav-btn:active {

  transform: scale(0.95);

}


</style>

</head>



<body>

<div class="nav">

<a href="index.html" class="nav-btn">

<span>⌂</span>

<span>HOME</span>

</a>


<a href="new.html" class="nav-btn">

<span>✨</span>

<span>NEW</span>

</a>


<a href="radio.html" class="nav-btn">

<span>📻</span>

<span>RADIO</span>

</a>


<a href="search.html" class="nav-btn">

<span>🔍</span>

<span>SEARCH</span>

</a>

</div>



<h1>
Okay Music
</h1>

<p class="message">

仲間と楽しむ<br>

音楽コレクション

</p>





<div class="search-box">

<input
type="text"
placeholder="アーティスト・アルバム・曲名で検索"
onkeyup="searchMusic()"
id="search">

</div>



<div id="result" class="result"></div>







<div class="menu">

<a href="artist.html">

🎤 アーティスト

</a>

</div>






<div class="menu">

<a href="album.html">

💿 アルバム

</a>

</div>






<div class="menu">

<a href="dvd.html">

📀 DVD・映像

</a>

</div>






<div class="menu">

<a href="favorite.html">

⭐ お気に入り

</a>

</div>







<script>


const musicData = [

{

keyword:[

"super beaver",
"superbeaver",

"幸福軌道",

"初回生産限定盤",

"シアワセ",

"二つの旅路",

"地球軸",

"電波",

"未だ見ぬ明日へ",

"ドクターペッパー",

"種の話",

"深呼吸",

"さよならも、ありがとう",

"日常サイクル",

"風",

"アカネボシ",

"secret track"

],


title:
"幸福軌道【初回生産限定盤】",

artist:
"SUPER BEAVER",

link:
"kouhukukidou.html"

}

];





function searchMusic(){


let input =
document
.getElementById("search")
.value
.toLowerCase();



let result =
document.getElementById("result");



result.innerHTML="";



if(input===""){

result.style.display="none";

return;

}



let found=false;



musicData.forEach(function(item){


let hit =
item.keyword.some(function(word){


return word
.toLowerCase()
.includes(input);


});



if(hit){


result.innerHTML +=

`

<a href="${item.link}">

💿 ${item.title}<br>

 ${item.artist}

</a>

`;

result.style.display="block";

found=true;


}


});



if(!found){


result.innerHTML="見つかりませんでした";

result.style.display="block";


}


}



</script>



</body>
