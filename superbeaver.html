<style>

body {

  background-color: #111;

  color: white;

  font-family: sans-serif;

  text-align: center;

  padding: 15px 0;

  padding-bottom: 80px;

}


h1 {

  font-size: 32px;

  margin: 8px 0 20px;

}


/* 下部4ボタン */

.nav {

  position: fixed;

  bottom: 0;

  left: 0;

  width: 100%;

  display: flex;

  justify-content: space-around;

  background: rgba(20,20,20,.95);

  padding: 10px 0 calc(10px + env(safe-area-inset-bottom));

  border-top: 1px solid #555;

  z-index: 9999;

}


.nav-btn {

  color: #c0c0c0;

  text-decoration: none;

  display: flex;

  flex-direction: column;

  align-items: center;

  font-size: 12px;

  gap: 4px;

  width: 25%;

}


.nav-btn:hover {

  transform: scale(1.08);

}


.nav-btn:active {

  transform: scale(0.95);

}


/* アーティスト全体 */

.artist-card {

  background-color: #222;

  width: 100%;

  max-width: 700px;

  margin: 15px auto;

  padding: 15px;

  border-radius: 15px;

  box-sizing: border-box;

}


.artist-name {

  font-size: 24px;

}


/* カテゴリ */

.category-title {

  text-align: left;

  font-size: 22px;

  margin: 30px 0 12px;

}


/* ジャケット一覧 */

.album-list {

  display: grid;

  grid-template-columns: repeat(2, minmax(0, 1fr));

  gap: 12px;

  width: 100%;

}


/* ジャケットカード */

.album {

  background-color: #333;

  padding: 8px;

  border-radius: 12px;

  transition: 0.2s;

  text-align: center;

  box-sizing: border-box;

}


.album:hover {

  transform: translateY(-4px);

  box-shadow: 0 8px 15px rgba(0,0,0,0.5);

}


.album-link {

  color: white;

  text-decoration: none;

  display: block;

}


.album-thumb {

  display: block;

  width: 100%;

  aspect-ratio: 1 / 1;

  object-fit: cover;

  margin: 0 auto;

  border-radius: 8px;

}


.album h3 {

  font-size: 16px;

  margin: 8px 0 3px;

  line-height: 1.2;

}


.album p {

  font-size: 12px;

  color: #ccc;

  margin: 0;

}

</style>
</head>
