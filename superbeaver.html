/* 下部4ボタン */

.nav {

  left: 0;

  padding: 10px 0 calc(10px + env(safe-area-inset-bottom));

  z-index: 9999;

.nav-btn {

  color: #c0c0c0;

  text-decoration: none;

  display: flex;

  flex-direction: column;

  font-size: 12px;

.nav-btn:hover {

.nav-btn:active {

/* アーティスト全体 */

.artist-card {

.artist-name {

/* カテゴリ */

.category-title {

  font-size: 22px;

  margin: 30px 0 12px;

}


/* ジャケット一覧 */

.album-list {

  display: grid;

  grid-template-columns: repeat(2, minmax(0, 1fr));

  gap: 12px;

  width: 100%;

}


/* ジャケットカード */

.album {

  background-color: #333;

  padding: 8px;

  border-radius: 12px;

  transition: 0.2s;

  text-align: center;

  box-sizing: border-box;

}


.album:hover {

  transform: translateY(-4px);

  box-shadow: 0 8px 15px rgba(0,0,0,0.5);

}


.album-link {

  color: white;

  text-decoration: none;

  display: block;

}


.album-thumb {

  display: block;

  width: 100%;

  aspect-ratio: 1 / 1;

  object-fit: cover;

  margin: 0 auto;

  border-radius: 8px;

}


.album h3 {

  font-size: 13px;

  margin: 8px 0 3px;

  line-height: 1.2;

}


.album p {

  font-size: 12px;

  color: #ccc;

  margin: 0;

}

</style>
