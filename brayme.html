<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bray me - Okay Music 🎵</title>

<link rel="apple-touch-icon" href="00002.png">

<link rel="stylesheet" href="style.css">

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>


<style>

/* =========================
   タイトル
   ========================= */

h1 {

  font-size: 32px;

  margin: 8px 0 20px;

}


/* =========================
   アーティスト全体
   ========================= */

.artist-card {

  background-color: #222;

  background-image: url("brayme2.jpg");

  background-repeat: repeat;

  background-size: 100px 100px;

  width: 100%;

  max-width: 700px;

  margin: 15px auto;

  padding: 15px;

  border-radius: 15px;

  box-sizing: border-box;

}


/* =========================
   カテゴリ
   ========================= */

.category-title {

  text-align: left;

  font-size: 22px;

  margin: 30px 0 12px;

}


/* =========================
   ジャケット一覧
   ========================= */

.album-list {

  display: grid;

  grid-template-columns: repeat(2, minmax(0, 1fr));

  gap: 12px;

  width: 100%;

}


/* =========================
   ジャケットカード
   ========================= */

.album {

  background-color: #333;

  padding: 8px;

  border-radius: 12px;

  transition: 0.2s;

  text-align: center;

  box-sizing: border-box;

}


.album:hover {

  transform: translateY(-4px);

  box-shadow: 0 8px 15px rgba(0,0,0,0.5);

}


.album-link {

  color: white;

  text-decoration: none;

  display: block;

}


.album-thumb {

  display: block;

  width: 100%;

  aspect-ratio: 1 / 1;

  object-fit: cover;

  margin: 0 auto;

  border-radius: 8px;

}


.album h3 {

  font-size: 13px;

  margin: 8px 0 3px;

  line-height: 1.3;

}


.album p {

  font-size: 12px;

  color: #ccc;

  margin: 0;

}

</style>

</head>


<body>


<!-- =========================
     Bray me
     ========================= -->
