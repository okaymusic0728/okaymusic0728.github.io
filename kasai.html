<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>喝采 - SUPER BEAVER - Okay MUSIC</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

body {

  background-color: #111;
  color: white;
  font-family: sans-serif;
  text-align: center;
  padding: 15px 0;
  padding-bottom: 80px;

}


h1 {

  font-size: 32px;
  margin: 8px 0;

}


.nav {

  position: fixed;

  bottom: 0;
  left: 0;

  width: 100%;

  display: flex;

  justify-content: space-around;

  background: rgba(20,20,20,.95);

  padding: 10px 0 calc(10px + env(safe-area-inset-bottom));

  border-top: 1px solid #555;

  z-index: 9999;

}


.nav-btn {

  color: #c0c0c0;

  text-decoration: none;

  display: flex;

  flex-direction: column;

  align-items: center;

  font-size: 12px;

  gap: 4px;

  width: 25%;

}


.nav-btn i {

  font-size: 20px;

}


.nav-btn:hover {

  transform: scale(1.08);

}


.nav-btn:active {

  transform: scale(0.95);

}


.album {

  background-color: #222;

  padding: 15px;

  margin: 20px auto;

  border-radius: 15px;

  width: 100%;

  max-width: 450px;

  box-sizing: border-box;

}


.album h1,
.album h2,
.album p {

  margin: 3px 0;

}


.album-jacket {

  width: calc(100% + 30px);

  max-width: none;

  margin-left: -15px;

  border-radius: 10px;

}


.song {

  background-color: #333;

  padding: 8px 12px;

  margin: 8px 0;

  border-radius: 10px;

  text-align: left;

  cursor: pointer;

  transition: 0.2s;

  height: 55px;

  box-sizing: border-box;

  display: flex;

  flex-direction: column;

  justify-content: center;

}


.song:hover {

  background-color: #555;

  transform: scale(1.03);

}


.song:active {

  transform: scale(0.97);

}


.player-box {

  background-color: #222;

  padding: 15px;

  margin: 30px auto;

  border-radius: 15px;

  width: 100%;

  max-width: 450px;

  box-sizing: border-box;

}

</style>

</head>


<body>


<div class="nav">

<a href="index.html" class="nav-btn">
<i class="fa-solid fa-house"></i>
<span>HOME</span>
</a>


<a href="new.html" class="nav-btn">
<i class="fa-solid fa-sparkles"></i>
<span>NEW</span>
</a>


<a href="radio.html" class="nav-btn">
<i class="fa-solid fa-radio"></i>
<span>RADIO</span>
</a>


<a href="search.html" class="nav-btn">
<i class="fa-solid fa-magnifying-glass"></i>
<span>SEARCH</span>
</a>

</div>



<div class="album">


<h2>
SUPER BEAVER
</h2>


<h1>
喝采
</h1>


<p>
2011.12.14 RELEASE
</p>


<img
class="album-jacket"
src="kasai.jpg"
alt="SUPER BEAVER 喝采 ジャケット">


<h2>
💿 収録曲
</h2>


<div
class="song"
id="song0"
onclick="playSong(0)">

▶ 01. 喝采

</div>


</div>



<div class="player-box">


<h3>
🎧 Now Playing
</h3>


<p id="now-title">
曲を選択してください
</p>


<div class="controls">


<button onclick="prevSong()">
⏮
</button>


<button onclick="togglePlay()">
▶
</button>


<button onclick="nextSong()">
⏭
</button>


</div>


<audio id="player" controls></audio>


</div>


<script>

const songs = [

  {
    title: "01. 喝采",
    file: "kasai.mp3"
  }

];


let currentSong = 0;


function playSong(number) {

  const player = document.getElementById("player");

  currentSong = number;

  document.querySelectorAll(".song").forEach(function(song){
    song.classList.remove("playing");
  });


  const songElement =
    document.getElementById("song" + number);


  if(songElement){
    songElement.classList.add("playing");
  }


  document.getElementById("now-title").innerHTML =
    songs[number].title;


  player.src = songs[number].file;

  player.play();

}


document
.getElementById("player")
.addEventListener(
"ended",
function(){

  if(currentSong < songs.length - 1){

    playSong(currentSong + 1);

  }

});


function prevSong(){

  if(currentSong > 0){

    playSong(currentSong - 1);

  }

}


function togglePlay(){

  const player =
    document.getElementById("player");


  if(player.paused){

    player.play();

  }else{

    player.pause();

  }

}


function nextSong(){

  if(currentSong < songs.length - 1){

    playSong(currentSong + 1);

  }

}

</script>

</body>

</html>
