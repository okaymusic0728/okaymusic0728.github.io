<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>喝采 - SUPER BEAVER - Okay MUSIC</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>


<div class="nav">

<a href="index.html" class="nav-btn">
<i class="fa-solid fa-house"></i>
<span>HOME</span>
</a>


<a href="new.html" class="nav-btn">
<i class="fa-solid fa-sparkles"></i>
<span>NEW</span>
</a>

<i class="fa-solid fa-radio"></i>
<span>RADIO</span>
</a>


<a href="search.html" class="nav-btn">
<i class="fa-solid fa-magnifying-glass"></i>
<span>SEARCH</span>
</a>

</div>



<div class="album">


<h2>
SUPER BEAVER
</h2>


<h1>
喝采
</h1>


<p>
2011.12.14 RELEASE
</p>


<img
class="album-jacket"
src="kasai.jpg"
alt="SUPER BEAVER 喝采 ジャケット">


<h2>
💿 収録曲
</h2>


<div
class="song"
id="song0"
onclick="playSong(0)">

▶ 01. 喝采

</div>


</div>



<div class="player-box">


<h3>
🎧 Now Playing
</h3>


<p id="now-title">
曲を選択してください
</p>


<div class="controls">


<button onclick="prevSong()">
⏮
</button>


<button onclick="togglePlay()">
▶
</button>


<button onclick="nextSong()">
⏭
</button>


</div>


<audio id="player" controls></audio>


</div>


<script>

const songs = [

  {
    title: "01. 喝采",
    file: "kasai.mp3"
  }

];


let currentSong = 0;


function playSong(number) {

  const player = document.getElementById("player");

  currentSong = number;

  document.querySelectorAll(".song").forEach(function(song){
    song.classList.remove("playing");
  });


  const songElement =
    document.getElementById("song" + number);


  if(songElement){
    songElement.classList.add("playing");
  }


  document.getElementById("now-title").innerHTML =
    songs[number].title;


  player.src = songs[number].file;

  player.play();

}


document
.getElementById("player")
.addEventListener(
"ended",
function(){

  if(currentSong < songs.length - 1){

    playSong(currentSong + 1);

  }

});


function prevSong(){

  if(currentSong > 0){

    playSong(currentSong - 1);

  }

}


function togglePlay(){

  const player =
    document.getElementById("player");


  if(player.paused){

    player.play();

  }else{

    player.pause();

  }

}


function nextSong(){

  if(currentSong < songs.length - 1){

    playSong(currentSong + 1);

  }

}

</script>

</body>

</html>
