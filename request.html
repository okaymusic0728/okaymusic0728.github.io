<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>


<title>
REQUEST - Okay Music
</title>


<link
  rel="apple-touch-icon"
  href="00001.png"
>


<link
  rel="stylesheet"
  href="style.css"
>


<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>


<style>


/* =========================================================
   REQUESTページ
   ========================================================= */


body {

  min-height:
    100vh;

}


/* =========================================================
   メイン
   ========================================================= */


.request-page {

  width:
    100%;

  max-width:
    700px;

  margin:
    0 auto;

  padding:
    55px
    18px
    180px;

  box-sizing:
    border-box;

}


/* =========================================================
   タイトル
   ========================================================= */


.request-page h1 {

  margin:
    0
    0
    30px;

  font-size:
    26px;

  text-align:
    left;

  letter-spacing:
    0.08em;

}


/* =========================================================
   説明
   ========================================================= */


.request-description {

  margin:
    0
    0
    25px;

  color:
    #ccc;

  font-size:
    14px;

  text-align:
    left;

  line-height:
    1.8;

}


/* =========================================================
   フォーム
   ========================================================= */


.request-form {

  display:
    flex;

  flex-direction:
    column;

  gap:
    15px;

}


.request-form input,

.request-form textarea {

  width:
    100%;

  padding:
    12px;

  border:
    none;

  border-radius:
    8px;

  box-sizing:
    border-box;

  font-size:
    14px;

}


.request-form textarea {

  min-height:
    120px;

  resize:
    vertical;

}


/* =========================================================
   投稿ボタン
   ========================================================= */


.request-submit {

  padding:
    12px;

  border:
    none;

  border-radius:
    8px;

  background:
    #ffffff;

  color:
    #111;

  font-size:
    14px;

  cursor:
    pointer;

}


</style>

</head>


<body>


<div class="request-page">


<h1>
REQUEST
</h1>


<p class="request-description">

追加してほしいアーティストやアルバム、
聴きたい楽曲などをリクエストしてください。

</p>


<form class="request-form">


<input
  type="text"
  placeholder="名前"
>


<textarea
  placeholder="リクエスト内容"
></textarea>


<button
  type="button"
  class="request-submit"
>

リクエストを送信

</button>


</form>


</div>


<script
  src="script.js"
></script>


</body>

</html>
