<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>山崎まさよし - Okay Music 🎵</title>

<link rel="apple-touch-icon" href="00002.png">

<link rel="stylesheet" href="style.css">

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>


<style>

/* =========================
   タイトル
   ========================= */

h1 {

  font-size: 32px;

  margin: 8px 0 20px;

}


/* =========================
   アーティスト全体
   ========================= */

.artist-card {

  background-color: #222;

  background-image: url("yamazakilogo.jpg");

  background-repeat: repeat;

  background-size: 100px 100px;

  width: 100%;

  max-width: 700px;

  margin: 15px auto;

  padding: 15px;

  border-radius: 15px;

  box-sizing: border-box;

}


/* =========================
   カテゴリ
   ========================= */

.category-title {

  text-align: left;

  font-size: 22px;

  margin: 30px 0 12px;

}


/* =========================
   ジャケット一覧
   ========================= */

.album-list {

  display: grid;

  grid-template-columns: repeat(2, minmax(0, 1fr));

  gap: 12px;

  width: 100%;

}


/* =========================
   ジャケットカード
   ========================= */

.album {

  background-color: #333;

  padding: 8px;

  border-radius: 12px;

  transition: 0.2s;

  text-align: center;

  box-sizing: border-box;

}


.album:hover {

  transform: translateY(-4px);

  box-shadow: 0 8px 15px rgba(0,0,0,0.5);

}


.album-link {

  color: white;

  text-decoration: none;

  display: block;

}


.album-thumb {

  display: block;

  width: 100%;

  aspect-ratio: 1 / 1;

  object-fit: cover;

  margin: 0 auto;

  border-radius: 8px;

}


.album h3 {

  font-size: 13px;

  margin: 8px 0 3px;

  line-height: 1.3;

}


.album p {

  font-size: 12px;

  color: #ccc;

  margin: 0;

}

</style>

</head>


<body>


<!-- =========================
     山崎まさよし
     ========================= -->

<div class="artist-card">


<h1>
山崎まさよし
</h1>

<div class="category-tabs">

  <button class="category-tab active" onclick="showCategory('album', this)">
    ALBUM
  </button>

  <button class="category-tab" onclick="showCategory('single', this)">
    SINGLE
  </button>

  <button class="category-tab" onclick="showCategory('digital', this)">
    配信
  </button>

  <button class="category-tab" onclick="showCategory('rare', this)">
    未発表/非売品
  </button>

  <button class="category-tab" onclick="showCategory('other', this)">
    TV/その他
  </button>

  <button class="category-tab" onclick="showCategory('radio', this)">
    ラジオ
  </button>

  <button class="category-tab" onclick="showCategory('video', this)">
    ビデオ
  </button>

</div>

<!-- =========================
     ALBUM
     ========================= -->

<div id="album" class="category-content active">

<h2 class="category-title">
　ALBUM
</h2>

<div class="album-list">


<!-- BLUE PERIOD -Complete SOUND + VISION PACKAGE [Limited Edition] -->

<div class="album">

<a href="blueperiod.html" class="album-link">

<img
src="blueperiod.jpg"
class="album-thumb"
alt="BLUE PERIOD -Complete SOUND + VISION PACKAGE [Limited Edition]">

<h3>
BLUE PERIOD -Complete SOUND + VISION PACKAGE [Limited Edition]
</h3>

<p>
生産限定盤<br>
</p>

</a>

</div>
</div>
</div>

<!-- =========================
     SINGLE
     ========================= -->

<div id="single" class="category-content">

<h2 class="category-title">
SINGLE
</h2>

<div class="album-list">


<!-- 準備中 -->

<div class="album">

<a href="junbi.html" class="album-link">

<img
src="junbi.jpg"
class="album-thumb"
alt="junbi">

<h3>
junbi
</h3>

<p>
junbi
</p>

</a>


</div>

</div>

</div>


<script>

function showCategory(
  category,
  button
) {

  document
    .querySelectorAll(
      ".category-content"
    )
    .forEach(
      function (content) {

        content.classList.remove(
          "active"
        );

      }
    );


  document
    .querySelectorAll(
      ".category-tab"
    )
    .forEach(
      function (tab) {

        tab.classList.remove(
          "active"
        );

      }
    );


  const target =
    document.getElementById(
      category
    );


  if (target) {

    target.classList.add(
      "active"
    );

  }


  button.classList.add(
    "active"
  );

}

</script>


<!-- 共通システム -->

<script src="script.js"></script>

</body>

</html>
