<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アルバム一覧 - Okay Music 🎵</title>

<style>
body {
  background-color: #111;
  color: white;
  font-family: sans-serif;
  text-align: center;
  padding: 30px;
  padding-bottom: 80px;
}

.nav {

  position: fixed;

  bottom: 0;

  left: 0;

  width: 100%;

  display: flex;

  justify-content: space-around;

  background: rgba(20,20,20,.95);

  padding: 10px 0 calc(10px + env(safe-area-inset-bottom));

  border-top: 1px solid #555;

  z-index: 9999;

}

.nav-btn {

  color: #c0c0c0;

  text-decoration: none;

  display: flex;

  flex-direction: column;

  align-items: center;

  font-size: 12px;

  gap: 4px;

  width: 25%;

}

.nav-btn:hover {

  transform: scale(1.08);

}

.nav-btn:active {

  transform: scale(0.95);

}
  
h1 {
  font-size: 36px;
}

.album-list {

  display: grid;

  grid-template-columns: repeat(2, minmax(0, 1fr));

  gap: 15px;

  max-width: 600px;

  margin: 30px auto;

}


.album {

  background: #222;

  padding: 15px;

  border-radius: 15px;

  transition: 0.2s;

  text-align: center;

  display: flex;

  flex-direction: column;

}


.album:hover {

  transform: translateY(-5px);

  box-shadow: 0 10px 20px rgba(0,0,0,0.5);

}




.album img {

  display: block;

  width: 100%;

  max-width: 180px;

  aspect-ratio: 1 / 1;

  object-fit: cover;

  margin: 0 auto;

  border-radius: 10px;

}

.album h2 {

  font-size: 17px;

  margin: 10px 0 5px;

  line-height: 1.2;

}

.album p {

  font-size: 13px;

  color: #ccc;

  margin: 0;

}
 
</style>

</head>
