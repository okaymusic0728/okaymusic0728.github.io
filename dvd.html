<meta charset="UTF-8">

<title>DVD・映像 - Okay Music</title>

<style>

body {
  background-color: #111;
  color: white;
  font-family: sans-serif;
  text-align: center;
  padding: 15px 0;
padding-bottom: 80px;
}

h1 {
  font-size: 32px;
}

.card {
  background-color: #222;
  max-width: 400px;
  margin: 20px auto;
  padding: 20px;
  border-radius: 15px;
}

.card a {
  color: white;
  text-decoration: none;
}

.video-card {

  background-color: #222;

  max-width: 450px;

  margin: 20px auto;

  padding: 15px;

  border-radius: 15px;

  box-sizing: border-box;

}


.video-title {

  text-align: left;

  font-size: 20px;

  margin: 5px 0 15px;

}


.video-container {

  position: relative;

  width: 100%;

  aspect-ratio: 16 / 9;

}


.video-container iframe {

  width: 100%;

  height: 100%;

  border: none;

  border-radius: 10px;

}

.nav {

  position: fixed;

  bottom: 0;

  left: 0;

  width: 100%;

  display: flex;

  justify-content: space-around;

  background: rgba(20,20,20,.95);

  padding: 10px 0 calc(10px + env(safe-area-inset-bottom));

  border-top: 1px solid #555;

  z-index: 9999;

}


.nav-btn {

  color: #c0c0c0;

  text-decoration: none;

  display: flex;

  flex-direction: column;

  align-items: center;

  font-size: 12px;

  gap: 4px;

  width: 25%;

}


.nav-btn:hover {

  transform: scale(1.08);

}


.nav-btn:active {

  transform: scale(0.95);

}

</style>

</head>


<body>


<h1>📀 DVD・映像</h1>


<div class="video-card">

<div class="video-title">
SUPER BEAVER
</div>

allowfullscreen>

</div>

</div>
